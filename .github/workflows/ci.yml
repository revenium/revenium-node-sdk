name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - node-version: 18
            provider-pins: openai@6 @google/genai@1
          - node-version: 20
            provider-pins: openai@6
          - node-version: 22
            provider-pins: ""

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - name: Install the provider majors supported on this Node version
        if: matrix.provider-pins != ''
        env:
          PROVIDER_PINS: ${{ matrix.provider-pins }}
        run: npm install --no-save --ignore-scripts $PROVIDER_PINS

      - run: npm run lint

      - run: npm run format:check

      - run: npm run build

      - run: npm test

      - run: npm run surface-check:selftest
